name: Feature request / 功能建议
description: 提议一个新功能或改进（中英文均可 / in Chinese or English）
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！欢迎先看看 [路线图](https://github.com/showhoo/itswe-nav#-路线图) 是否已覆盖。
        Thanks! Please check the [roadmap](https://github.com/showhoo/itswe-nav#-路线图) first.

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem does this solve?
      description: 描述你的使用场景 / describe your use case
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案 / Proposed solution
      description: 你希望它怎么工作 / how would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / Alternatives considered
